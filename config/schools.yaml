# 高校官网信息采集 - 试点学校入口清单
# 添加学校：在 schools 下新增一项，填写 name / domain / sources
# sources 为该校需要采集的栏目入口（研究生院 / 招生网 / 信息公开网 / 通知公告等）
# category 取值建议：招生 / 通知公告 / 信息公开
# browser: true 表示该栏目启用 Playwright 真实浏览器抓取（用于过反爬，如北邮的 JS 挑战）
# 注意：url 必须是该校官方域名下的地址，采集时会做域名过滤

schools:
  - name: 南京理工大学
    domain: njust.edu.cn
    sources:
      - name: 研究生院
        url: https://gs.njust.edu.cn/
        category: 通知公告
      - name: 研究生招生网
        url: https://gs.njust.edu.cn/zsw/
        category: 招生
      - name: 信息公开（招生）
        url: https://xxgk.njust.edu.cn/14426/list.htm
        category: 信息公开

  - name: 西安电子科技大学
